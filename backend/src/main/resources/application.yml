server:
  port: 8080

spring:
  application:
    name: pollino-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pollino}
      database: ${MONGODB_DATABASE:pollino}
      auto-index-creation: true
  mail:
    host: ${SMTP_HOST:smtp.ionos.de}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:mail@ahmadre.com}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
        transport:
          protocol: smtps
  thymeleaf:
    check-template-location: true
    prefix: classpath:/templates/
    suffix: .html

# Pollino application configuration
pollino:
  api:
    # API key for admin operations (generate a secure random key for production)
    api-key: ${API_KEY:changeme-generate-secure-key}
  cleanup:
    # Run cleanup every hour
    cron: ${CLEANUP_CRON:0 0 * * * *}
    enabled: ${CLEANUP_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  mail:
    sender-address: ${SMTP_SENDER:Pollino <poll@ahmadre.com>}
    enabled: ${MAIL_ENABLED:true}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:1234/v1}
    model: ${AI_MODEL:default}
    enabled: ${AI_ENABLED:false}
    api-key: ${AI_API_KEY:}

# Rate limiting
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests-per-minute: ${RATE_LIMIT_RPM:200}
  vote-requests-per-minute: ${RATE_LIMIT_VOTE_RPM:20}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.pollino: ${LOG_LEVEL:INFO}
    org.springframework.data.mongodb: ${MONGO_LOG_LEVEL:WARN}
