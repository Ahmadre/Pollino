# Pollino Stack - Simplified Docker Compose
# Usage:
#   Start:    docker compose up -d
#   Stop:     docker compose down
#   Destroy:  docker compose down -v --remove-orphans
#   Logs:     docker compose logs -f

name: pollino-stack

services:

  # MongoDB Database
  mongodb:
    container_name: pollino-mongodb
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-pollino}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-pollino_secret}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-pollino}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pollino-network

  # Spring Boot Backend API
  backend:
    container_name: pollino-backend
    image: ahmadre/pollino-backend:latest
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGODB_USER:-pollino}:${MONGODB_PASSWORD:-pollino_secret}@mongodb:27017/${MONGODB_DATABASE:-pollino}?authSource=admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-pollino}
      API_KEY: ${API_KEY:-changeme-generate-secure-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      CLEANUP_ENABLED: ${CLEANUP_ENABLED:-true}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 0 * * * *}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      RATE_LIMIT_VOTE_RPM: ${RATE_LIMIT_VOTE_RPM:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JAVA_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pollino-network

  # Flutter Web Frontend
  frontend:
    container_name: pollino-frontend
    image: ahmadre/pollino-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:8080"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3001}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      FLUTTER_WEB_USE_SKIA: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      timeout: 5s
      interval: 10s
      retries: 3
    networks:
      - pollino-network

volumes:
  mongodb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume1/docker/pollino/data
  mongodb-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume1/docker/pollino/config

networks:
  pollino-network:
    driver: bridge
